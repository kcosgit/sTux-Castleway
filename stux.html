
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>SRisk Autônomo 😼</title>
  <meta name="description" content="SRisk, o mascote autônomo, irônico e radical da Seu Risco.">

  <style>
    :root {
      --srisk-green: #2ecc71;
      --srisk-orange: #e67e22;
      --srisk-red: #e74c3c;
      --srisk-dark: #1a1e24;
      --srisk-shadow: rgba(0, 0, 0, .25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 12px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ecf0f1;
      background: radial-gradient(
        circle at 50% 20%,
        #2c3e50 0%,
        #111827 100%
      );
      transition: background 1s ease;
    }

    body.night-mode {
      background: radial-gradient(
        circle at 50% 20%,
        #0f172a 0%,
        #030712 100%
      );
    }

    button,
    input {
      font: inherit;
    }

    .srisk-app {
      width: min(100%, 800px);
      margin: 0 auto;
    }

    .srisk-header {
      margin-bottom: 20px;
      text-align: center;
    }

    .srisk-header h1 {
      margin: 0 0 6px;
      color: #f39c12;
      font-size: clamp(26px, 5vw, 40px);
      text-shadow: 0 2px 8px rgba(243, 156, 18, .3);
    }

    .srisk-header p {
      margin: 0;
      color: #95a5a6;
      font-size: 15px;
    }

    /* CENÁRIO */
    .srisk-stage {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      height: 440px;
      border: 3px solid #34495e;
      border-radius: 24px;
      background: linear-gradient(
        180deg,
        #2c3e50 0%,
        #1a252f 70%,
        #111827 100%
      );
      box-shadow: 0 20px 40px rgba(0, 0, 0, .5);
      transition: background 1s ease;
    }

    .night-mode .srisk-stage {
      background: linear-gradient(
        180deg,
        #0f172a 0%,
        #090d16 70%,
        #020617 100%
      );
    }

    .srisk-city-bg {
      position: absolute;
      inset: 0;
      opacity: .15;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        90deg,
        #34495e 0,
        #34495e 40px,
        transparent 40px,
        transparent 80px
      );
    }

    .srisk-ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 75px;
      border-top: 4px solid #f39c12;
      background: #111827;
      box-shadow: 0 -5px 20px rgba(243, 156, 18, .2);
    }

    /* STATUS */
    .srisk-status {
      position: absolute;
      z-index: 6;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 12px;
      background: rgba(26, 30, 36, .85);
      color: #bdc3c7;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .srisk-status strong {
      color: #fff;
    }

    .srisk-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .srisk-status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: var(--srisk-green);
      box-shadow: 0 0 8px var(--srisk-green);
    }

    .srisk-status-dot.is-sleeping {
      background: #95a5a6;
      box-shadow: 0 0 8px #95a5a6;
    }

    /* BALÃO DE FALA */
    .srisk-bubble {
      position: absolute;
      z-index: 8;
      bottom: 235px;
      left: 50%;
      width: min(320px, 85%);
      padding: 14px 18px;
      border-radius: 18px;
      background: #fff;
      color: #1a1e24;
      text-align: center;
      line-height: 1.4;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .3);
      transform: translateX(-50%);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity .3s ease,
        bottom .3s ease,
        visibility .3s;
    }

    .srisk-bubble.visible {
      bottom: 245px;
      opacity: 1;
      visibility: visible;
    }

    .srisk-bubble::after {
      position: absolute;
      bottom: -9px;
      left: calc(50% - 9px);
      width: 18px;
      height: 18px;
      background: #fff;
      content: "";
      transform: rotate(45deg);
    }

    .srisk-bubble strong {
      display: block;
      margin-bottom: 4px;
      color: #d35400;
      font-size: 12px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .srisk-character {
        position: absolute;
        left: 50%;
        bottom: 22px;
        width: 130px;
        height: 150px;
        transform: translateX(-50%);
        cursor: pointer;
        z-index: 5;
        transform-origin: center bottom;
        transition: left 1.5s ease-in-out;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .srisk-character svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 5px 4px rgba(0, 0, 0, 0.15));
    }

    .srisk-character:focus-visible {
        outline: 3px solid #ffb74d;
        outline-offset: 5px;
        border-radius: 16px;
    }

    .srisk-character.is-dancing {
        animation: srisk-dance 0.5s ease-in-out 3;
    }

    .srisk-character.is-surprised {
        animation: srisk-surprise 0.45s ease-in-out 2;
    }

    .srisk-character.is-moving {
        animation: srisk-bounce 0.6s ease-in-out;
    }

    .srisk-character.is-sleeping {
        animation: srisk-sleep 2.5s ease-in-out infinite;
    }

    @keyframes srisk-dance {
        0%, 100% { transform: translateX(-50%) rotate(0deg); }
        25% { transform: translateX(-50%) rotate(-12deg) translateY(-8px); }
        75% { transform: translateX(-50%) rotate(12deg) translateY(-8px); }
    }

    @keyframes srisk-surprise {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.15); }
    }

    @keyframes srisk-bounce {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(-15px); }
    }

    @keyframes srisk-sleep {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(4px); }
    }

    .srisk-bubble {
        position: absolute;
        left: 50%;
        bottom: 195px;
        transform: translateX(-50%);
        width: min(280px, calc(100% - 30px));
        padding: 14px 17px;
        border-radius: 18px;
        background: #fff;
        color: #263238;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
        z-index: 10;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease;
        overflow-wrap: anywhere;
    }

    .srisk-bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -10px;
        transform: translateX(-50%);
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 11px solid #fff;
    }

    .srisk-bubble.is-visible {
        opacity: 1;
        visibility: visible;
    }

    .srisk-bubble strong {
        color: #2e7d32;
    }

    .srisk-ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 25px;
        background: linear-gradient(to bottom, #a5d6a7, #81c784);
        border-radius: 0 0 18px 18px;
    }

    .srisk-stage-hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 30px;
        text-align: center;
        font-size: 11px;
        color: #527b54;
        pointer-events: none;
    }

    .srisk-avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #e8f5e9;
        font-size: 24px;
    }

    .srisk-chat {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 18px;
    }

    .srisk-chat input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid #c8e6c9;
        border-radius: 12px;
        outline: none;
        font: inherit;
        font-size: 14px;
    }

    .srisk-chat input:focus {
        border-color: #43a047;
        box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.12);
    }

    .srisk-chat button {
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: #2e7d32;
        color: white;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .srisk-chat button:hover {
        background: #1b5e20;
    }

    .srisk-chat button:focus-visible {
        outline: 3px solid #ffb74d;
        outline-offset: 3px;
    }

    .srisk-footer {
        margin-top: 18px;
        text-align: center;
        color: #789078;
        font-size: 12px;
        line-height: 1.6;
    }

    .srisk-footer a {
        color: #2e7d32;
        font-weight: bold;
        text-decoration: none;
    }

    .srisk-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .srisk-container {
            padding: 14px;
        }

        .srisk-stage {
            height: 360px;
        }

        .srisk-character {
            width: 112px;
            height: 132px;
        }

        .srisk-bubble {
            bottom: 175px;
            font-size: 13px;
        }

        .srisk-chat {
            gap: 7px;
        }

        .srisk-chat button {
            padding: 12px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            scroll-behavior: auto !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
</head>
<body>
    <main class="srisk-container">
        <header class="srisk-header">
            <div class="srisk-avatar" aria-hidden="true">😼</div>
            <div class="srisk-heading">
                <h1>SRisk Autônomo</h1>
                <p>Um gatinho virtual com personalidade própria</p>
            </div>
            <div class="srisk-status" title="Personagem ativo">
                <span class="srisk-status-dot" id="sriskStatusDot"></span>
                <span id="sriskStatusText">Ativo</span>
            </div>
        </header>

        <section
            class="srisk-stage"
            id="sriskStage"
            aria-label="Cenário interativo do SRisk"
        >
            <div class="srisk-stage-top">
                <span id="sriskMood">😺 Humor: tranquilo</span>
                <span id="sriskAnnoyance">😾 Irritação: 0%</span>
            </div>

            <div
                class="srisk-bubble"
                id="sriskBubble"
                role="status"
                aria-live="polite"
            >
                <span id="sriskBubbleText"></span>
            </div>

            <div
                class="srisk-character"
                id="sriskCharacter"
                role="button"
                tabindex="0"
                aria-label="SRisk, personagem interativo. Clique ou pressione Enter para interagir."
            >
                <div id="sriskAvatarContainer" aria-hidden="true"></div>
            </div>

            <div class="srisk-stage-hint">
                Clique no SRisk para interagir com ele!
            </div>
            <div class="srisk-ground" aria-hidden="true"></div>
        </section>

        <form class="srisk-chat" id="sriskChatForm">
            <input
                type="text"
                id="sriskChatInput"
                name="message"
                placeholder="Converse com o SRisk..."
                autocomplete="off"
                maxlength="300"
                aria-label="Mensagem para o SRisk"
            >
            <button type="submit">Enviar</button>
        </form>

        <footer class="srisk-footer">
            <p>
                O SRisk tem vida própria: observe suas reações e converse com ele.
            </p>
        </footer>
    </main>

const HAPPY_PHRASES = [
    "Isso! Estou gostando dessa brincadeira!",
    "Agora sim! Mais animação!",
    "Você sabe como me deixar feliz!",
    "Miau! Hoje estou impossível!",
    "Gostei disso! Vamos continuar!"
];

const GRUMPY_PHRASES = [
    "Ei! Não precisa clicar tanto!",
    "Calma aí! Eu também preciso respirar!",
    "Você não cansa, não?",
    "Olha que eu vou ficar emburrado!",
    "Poxa! Deixa o gatinho em paz um pouquinho!",
    "Já entendi! Você gosta de apertar botões!"
];

const SLEEP_PHRASES = [
    "Zzz... só vou descansar um pouquinho...",
    "Cinco minutinhos... só mais cinco...",
    "Se precisar de mim, tenta não gritar. Zzz...",
    "Estou recarregando minhas energias..."
];

/* =====================================================
   FUNÇÕES AUXILIARES
===================================================== */

function randomItem(items) {
    return items[Math.floor(Math.random() * items.length)];
}

function setExpression(expression) {
    const svg = SVG_EXPRESSIONS[expression] || SVG_EXPRESSIONS.idle;
    avatarContainer.innerHTML = svg;
}

function updateMood() {
    if (state.isSleeping) {
        state.mood = "sonolento";
        moodElement.textContent = "😴 Humor: sonolento";
    } else if (state.annoyance >= 70) {
        state.mood = "irritado";
        moodElement.textContent = "😾 Humor: irritado";
    } else if (state.annoyance >= 30) {
        state.mood = "desconfiado";
        moodElement.textContent = "😼 Humor: desconfiado";
    } else {
        state.mood = "tranquilo";
        moodElement.textContent = "😺 Humor: tranquilo";
    }

    annoyanceElement.textContent = `😾 Irritação: ${state.annoyance}%`;
}

function say(message, duration = 4000) {
    if (!message) return;

    bubbleText.textContent = message;
    bubble.classList.add("is-visible");

    clearTimeout(state.bubbleTimeout);
    state.bubbleTimeout = setTimeout(() => {
        bubble.classList.remove("is-visible");
    }, duration);
}

function clearCharacterActions() {
    clearTimeout(state.movementTimeout);
    clearTimeout(state.actionTimeout);

    character.classList.remove(
        "is-dancing",
        "is-surprised",
        "is-moving",
        "is-sleeping"
    );
}

function wakeUp() {
    if (!state.isSleeping) return;

    state.isSleeping = false;
    character.classList.remove("is-sleeping");
    setExpression("idle");
    updateMood();
}

function registerInteraction() {
    state.lastInteraction = Date.now();

    if (state.isSleeping) {
        wakeUp();
    }
}

/* =====================================================
   SAUDAÇÃO E HORÁRIO
===================================================== */

function getGreeting() {
    const hour = new Date().getHours();

    if (hour >= 5 && hour < 12) {
        return "Bom dia! Já estou de pé... mais ou menos. 😺";
    }

    if (hour >= 12 && hour < 18) {
        return "Boa tarde! Preparado para uma aventura?";
    }

    return "Boa noite! Vamos conversar um pouquinho?";
}

function checkDayNightCycle() {
    const hour = new Date().getHours();

    if (hour >= 22 || hour < 6) {
        statusText.textContent = "Modo noturno";
        statusDot.style.backgroundColor = "#78909c";
    } else {
        statusText.textContent = "Ativo";
        statusDot.style.backgroundColor = "#43a047";
    }
}

/* =====================================================
   MOVIMENTAÇÃO AUTÔNOMA
===================================================== */

function moveAutonomously() {
    if (document.hidden || state.isSleeping) return;

    const stageWidth = stage.clientWidth;
    const characterWidth = character.offsetWidth;

    const margin = Math.max(characterWidth / 2 + 8, 20);
    const availableWidth = stageWidth - margin * 2;

    if (availableWidth <= 0) return;

    const newX = margin + Math.random() * availableWidth;

    character.style.left = `${newX}px`;
    state.position = (newX / stageWidth) * 100;

    character.classList.remove("is-moving");
    void character.offsetWidth;
    character.classList.add("is-moving");

    setTimeout(() => {
        character.classList.remove("is-moving");
    }, 650);
}

/* =====================================================
   AÇÕES AUTÔNOMAS
===================================================== */

function performAutonomousAction() {
    if (document.hidden) return;

    const idleTime = Date.now() - state.lastInteraction;
    const hour = new Date().getHours();

    if (state.isSleeping) {
        if (Math.random() < 0.35) {
            wakeUp();
            setExpression("surprised");
            say("Hã?! Eu estava descansando!", 3500);
        }
        return;
    }

    if (idleTime > 45000 && (hour >= 22 || hour < 6)) {
        state.isSleeping = true;
        clearCharacterActions();
        character.classList.add("is-sleeping");
        setExpression("sleepy");
        say(randomItem(SLEEP_PHRASES), 5000);
        updateMood();
        return;
    }

    const action = Math.random();

    if (action < 0.30) {
        moveAutonomously();
    } else if (action < 0.50) {
        setExpression("happy");
        character.classList.add("is-dancing");
        say(randomItem(HAPPY_PHRASES), 3500);

        state.actionTimeout = setTimeout(() => {
            character.classList.remove("is-dancing");
            setExpression("idle");
        }, 1600);
    } else if (action < 0.65) {
        setExpression("surprised");
        character.classList.add("is-surprised");
        say("Opa! O que foi isso?!", 3000);

        state.actionTimeout = setTimeout(() => {
            character.classList.remove("is-surprised");
            setExpression("idle");
        }, 1000);
    } else if (action < 0.82) {
        say(randomItem(NORMAL_PHRASES), 3500);
    } else {
        setExpression("idle");
    }
}

/* =====================================================
   CLIQUES E IRRITAÇÃO
===================================================== */

function spawnReaction() {
    registerInteraction();

    state.clicks += 1;
    state.annoyance = Math.min(100, state.annoyance + 8);

    clearTimeout(state.clickResetTimeout);
    state.clickResetTimeout = setTimeout(() => {
        state.clicks = 0;
        state.annoyance = Math.max(0, state.annoyance - 15);
        updateMood();
    }, 5000);

    updateMood();

    if (state.annoyance >= 70) {
        setExpression("grumpy");
        say(randomItem(GRUMPY_PHRASES), 4000);
    } else if (state.clicks >= 3) {
        setExpression("surprised");
        say("Ei! Quantas vezes você vai clicar?! 😹", 3500);
    } else if (Math.random() < 0.5) {
        setExpression("happy");
        say(randomItem(HAPPY_PHRASES), 3000);
    } else {
        setExpression("idle");
        say(randomItem(NORMAL_PHRASES), 3000);
    }

    clearTimeout(state.actionTimeout);
    state.actionTimeout = setTimeout(() => {
        if (!state.isSleeping) {
            setExpression("idle");
        }
    }, 1800);
}

/* =====================================================
   RESPOSTAS À CONVERSA
===================================================== */

function getChatResponse(message) {
    const text = message
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

    if (!text) {
        return "Você precisa escrever alguma coisa para eu responder! 😹";
    }

    if (/\b(oi|ola|eai|e ai|opa|hey|hello|bom dia|boa tarde|boa noite)\b/.test(text)) {
        return getGreeting();
    }

    if (/\b(quem e voce|seu nome|como voce chama|quem e o srisk)\b/.test(text)) {
        return "Eu sou o SRisk! Um gatinho virtual cheio de personalidade. 😼";
    }

    if (/\b(tudo bem|como voce esta|como vai)\b/.test(text)) {
        return "Estou bem! Quer dizer... depende de quantas vezes você clicar em mim! 😹";
    }

    if (/\b(obrigado|obrigada|valeu|agradeco)\b/.test(text)) {
        return "Por nada! Pode agradecer com um petisco virtual. 😸";
    }

    if (/\b(te amo|amo voce|gosto de voce|gosto de ti)\b/.test(text)) {
        return "Opa! Assim você deixa um gatinho todo sem graça! 💚";
    }

    if (/\b(tchau|adeus|ate mais|falou|vou embora)\b/.test(text)) {
        return "Tudo bem! Vou ficar por aqui tomando conta do meu território. Até mais! 😺";
    }

    if (/\b(danca|dancar|dancando|dancinha)\b/.test(text)) {
        return "Quer ver meu talento? Segura essa! 💃";

    }

    if (/\b(dorme|dormir|sono|soninho|cansado)\b/.test(text)) {
        return "Falou em dormir? Agora você chamou minha atenção... Zzz...";
    }

    if (/\b(bravo|brava|irritado|irritada|nervoso|nervosa)\b/.test(text)) {
        return "Eu? Bravo? Só um pouquinho... principalmente quando clicam demais! 😾";
    }

    if (/\b(gato|gatinho|miau|meow)\b/.test(text)) {
        return "Miau! Finalmente alguém falando a minha língua! 🐾";
    }

    if (/\b(pi ada|piada|engracado|engracada|rir|risada)\b/.test(text)) {
        return "Por que o gato sentou no computador? Para ficar de olho no mouse! 🐭";
    }

    if (/\b(ajuda|o que voce faz|como funciona)\b/.test(text)) {
        return "Você pode conversar comigo, clicar em mim e observar minhas ações autônomas. Só não exagera nos cliques! 😹";
    }

    if (/\b(corinthians|tim ao|timao)\b/.test(text)) {
        return "Até o gatinho sabe que uma boa conversa pode virar discussão de futebol! ⚽";
    }

    if (/\b(clique|clicar|cliquei|apertar)\b/.test(text)) {
        return "Pode interagir comigo, mas cuidado: minha paciência tem limites! 😼";
    }

    const fallbackResponses = [
        "Interessante... me conta mais!",
        "Hmm... preciso pensar sobre isso.",
        "Será que você pode explicar de outro jeito?",
        "Eu sou um gatinho, não um especialista em tudo! 😹",
        "Estou ouvindo! Continue...",
        "Miau! Essa é nova para mim.",
        "Não sei bem o que responder, mas gostei da conversa!",
        "Será que isso tem alguma coisa a ver com petiscos?",
        "Vou guardar essa informação no meu cérebro de gatinho!",
        "Você sempre tem umas ideias interessantes!"
    ];

    return randomItem(fallbackResponses);
}

/* =====================================================
   EVENTOS DO PERSONAGEM
===================================================== */

function handleCharacterInteraction() {
    spawnReaction();
}

character.addEventListener("click", handleCharacterInteraction);

character.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        handleCharacterInteraction();
    }
});

/* =====================================================
   FORMULÁRIO DE CONVERSA
===================================================== */

chatForm.addEventListener("submit", (event) => {
    event.preventDefault();

    const message = chatInput.value.trim();

    if (!message) {
        say("Escreva alguma coisa antes de enviar! 😺", 2500);
        chatInput.focus();
        return;
    }

    registerInteraction();

    const response = getChatResponse(message);

    state.annoyance = Math.max(0, state.annoyance - 5);
    updateMood();

    if (/\b(danca|dancar|dancando|dancinha)\b/i.test(message)) {
        clearCharacterActions();
        setExpression("happy");
        character.classList.add("is-dancing");

        say(response, 3500);

        state.actionTimeout = setTimeout(() => {
            character.classList.remove("is-dancing");
            setExpression("idle");
        }, 1600);
    } else {
        if (state.annoyance < 70) {
            setExpression("happy");
        } else {
            setExpression("grumpy");
        }

        say(response, 4500);

        clearTimeout(state.actionTimeout);
        state.actionTimeout = setTimeout(() => {
            if (!state.isSleeping) {
                setExpression("idle");
            }
        }, 1800);
    }

    chatInput.value = "";
    chatInput.focus();
});

/* =====================================================
   REAÇÃO AO RETORNAR À ABA
===================================================== */

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        statusText.textContent = "Em pausa";
        return;
    }

    checkDayNightCycle();
    state.lastInteraction = Date.now();
});

/* =====================================================
   AJUSTE DE POSIÇÃO AO REDIMENSIONAR
===================================================== */

window.addEventListener("resize", () => {
    if (document.hidden) return;

    const stageWidth = stage.clientWidth;
    const characterWidth = character.offsetWidth;
    const margin = Math.max(characterWidth / 2 + 8, 20);

    const currentLeft = parseFloat(character.style.left);

    if (!Number.isFinite(currentLeft)) return;

    const boundedLeft = Math.min(
        Math.max(currentLeft, margin),
        Math.max(margin, stageWidth - margin)
    );

    character.style.left = `${boundedLeft}px`;
});

/* =====================================================
   INICIALIZAÇÃO
===================================================== */

function initSRisk() {
    setExpression("idle");
    updateMood();
    checkDayNightCycle();

    say(getGreeting(), 5000);

    moveAutonomously();

    state.autonomousInterval = setInterval(() => {
        performAutonomousAction();
    }, 7000);

    // Atualiza o ciclo de dia e noite periodicamente.
    setInterval(() => {
        checkDayNightCycle();
    }, 60000);
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initSRisk, { once: true });
} else {
    initSRisk();
}
</script>
